<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otto</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --text:#1d1d1b; --muted:#6b6a66; --accent:#c4623f; --me:#1d1d1b; --meText:#fff; --border:#e4e2dc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#171716; --card:#222220; --text:#eceae4; --muted:#9a9890; --accent:#e07a55; --me:#eceae4; --meText:#171716; --border:#33322f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; height:100dvh; display:flex; flex-direction:column; }
  header { padding:14px 16px; border-bottom:1px solid var(--border); font-weight:600; font-size:18px; }
  header span { color:var(--accent); }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; max-width:760px; width:100%; margin:0 auto; }
  .msg { padding:10px 14px; border-radius:14px; max-width:85%; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--me); color:var(--meText); }
  .bot { align-self:flex-start; background:var(--card); border:1px solid var(--border); }
  .empty { color:var(--muted); text-align:center; margin-top:20vh; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--border); max-width:760px; width:100%; margin:0 auto; }
  textarea { flex:1; resize:none; padding:10px 12px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); font:inherit; }
  button { padding:0 18px; border:0; border-radius:12px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header><span>●</span> Otto</header>
<div id="chat"><div class="empty">Përshëndetje! Unë jam Otto. Më shkruaj diçka.</div></div>
<form id="form">
  <textarea id="input" rows="1" placeholder="Shkruaj mesazhin..." required></textarea>
  <button id="send">Dërgo</button>
</form>
<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const history = [];

  function add(role, text) {
    chat.querySelector(".empty")?.remove();
    const el = document.createElement("div");
    el.className = "msg " + (role === "user" ? "user" : "bot");
    el.textContent = text;
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
    return el;
  }

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    send.disabled = true;
    add("user", text);
    history.push({ role: "user", content: text });
    const bot = add("bot", "…");

    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let answer = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        answer += dec.decode(value, { stream: true });
        bot.textContent = answer;
        chat.scrollTop = chat.scrollHeight;
      }
      history.push({ role: "assistant", content: answer || "(pa përgjigje)" });
    } catch {
      bot.textContent = "Nuk u lidh dot me serverin.";
      history.pop();
    }
    send.disabled = false;
    input.focus();
  });
</script>
</body>
</html>
